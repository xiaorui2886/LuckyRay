name: Read-only canvas focused QA
on:
  push:
    branches: [qa/canvas-readonly-20261104]
    paths: ['.github/workflows/source-checks.yml']
permissions:
  contents: read
concurrency:
  group: canvas-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-readonly:
    if: >-
      github.event_name == 'push' && github.event.before == 'c76e1117d94b4ed02edd9bbc06fab0b029ac8e04' && github.event.head_commit.message == 'test: run reviewed readonly canvas QA once (20261104-1927-desktop)'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: luckyray-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: c76e1117d94b4ed02edd9bbc06fab0b029ac8e04
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - name: Verify exact reviewed source commit
        run: |
          test "$(git rev-parse HEAD)" = "c76e1117d94b4ed02edd9bbc06fab0b029ac8e04"
          git rev-parse HEAD
      - name: Verify reviewed source bytes
        run: sha256sum --check tests/canvas-qa-sources.sha256
      - name: Install public locked dependencies without lifecycle scripts
        run: |
          npm install --global pnpm@11.3.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Actual read-client transport behavior with synthetic responses
        run: node tests/canvasRemoteReadClient.test.mjs
      - name: Actual readonly loader and polling lifecycle
        run: node --experimental-strip-types --test tests/canvasReadonlyRuntime.test.ts
      - name: Media projection source contracts only, not native execution
        run: node --test tests/canvasMediaProjection.contract.test.mjs
      - name: Verify dependency lockfiles and reviewed inputs unchanged
        run: |
          sha256sum --check tests/canvas-qa-sources.sha256
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
