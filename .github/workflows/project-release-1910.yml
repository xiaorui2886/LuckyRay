name: Project verified 1.9.10 source
on:
  push:
    branches: [release/public-source-1.9.10-20261106]
    paths:
      - scripts/project-release-1910.py
permissions:
  contents: write
jobs:
  project-source:
    if: github.repository == 'xiaorui2886/LuckyRay'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/public-source-1.9.10-20261106
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - name: Import hash-pinned public source and enforce public boundary
        run: python scripts/project-release-1910.py
      - name: Commit product projection to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync reviewed 1.9.10 product source from published release asset'
          git push origin HEAD:refs/heads/release/public-source-1.9.10-20261106
