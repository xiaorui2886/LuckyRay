name: Linux normal sandbox startup diagnostic
on:
  push:
    branches: [port/linux-desktop-20261101]
permissions:
  contents: read
jobs:
  linux-browser-startup-diagnostic:
    if: github.repository == 'xiaorui2886/LuckyRay'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out only the public candidate
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind the source and initialize private startup state
        id: init
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-startup-work
        run: python3 luckyray-app/tests/linux-browser-ci.py init --startup-only --work "$WORK_ROOT"
      - name: Select the pinned Node for Chromium control
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - name: Exercise the preinstalled browser and normal sandbox once
        id: preflight
        timeout-minutes: 3
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-startup-work
        run: python3 luckyray-app/tests/linux-browser-ci.py preflight --startup-only --work "$WORK_ROOT"
      - name: Summarize startup only and leave product acceptance not run
        if: ${{ always() && steps.init.outcome == 'success' }}
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-startup-work
          CI_CHECKOUT: ${{ steps.checkout.outcome }}
          CI_INIT: ${{ steps.init.outcome }}
          CI_NODE: ${{ steps.node.outcome }}
          CI_PREFLIGHT: ${{ steps.preflight.outcome }}
        run: python3 luckyray-app/tests/linux-browser-ci.py finish --startup-only --work "$WORK_ROOT"
      - name: Retain only the three startup evidence JSON files
        if: ${{ always() && steps.init.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-browser-startup-synthetic-evidence
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/luckyray-linux-startup-work/evidence/source.json
            ${{ runner.temp }}/luckyray-linux-startup-work/evidence/preflight.json
            ${{ runner.temp }}/luckyray-linux-startup-work/evidence/result.json
