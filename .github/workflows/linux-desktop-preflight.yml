name: Linux desktop native diagnostics
on:
  push:
    branches: [port/linux-desktop-20261101]
permissions:
  contents: read
jobs:
  linux-native-diagnostics:
    if: github.repository == 'xiaorui2886/LuckyRay'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Check out the public candidate
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the candidate commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'Commit: %s\n' "$actual"
          test "$actual" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Install native development dependencies on the disposable runner
        id: native_deps
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          pkg-config --modversion webkit2gtk-4.1 gtk+-3.0
      - name: Install the pinned Rust toolchain
        id: rust
        continue-on-error: true
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check the real Linux application library
        id: main_check
        if: ${{ always() && !cancelled() && steps.native_deps.outcome == 'success' && steps.rust.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 35
        env:
          # Diagnostic only: never interpreted as resource, sidecar identity,
          # packaging, or release admission verification.
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":null,"resources":null}}'
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-diagnostic-target
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Source compilation diagnostic only; package resources, sidecar identity, and release gates are NOT verified."
          rustup run 1.95.0 cargo check --locked --lib \
            --target x86_64-unknown-linux-gnu \
            --manifest-path luckyray-app/src-tauri/Cargo.toml
      - name: Compile the real library test binary
        id: test_compile
        if: ${{ always() && !cancelled() && steps.main_check.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 35
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":null,"resources":null}}'
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-diagnostic-target
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.95.0 cargo test --locked --lib --no-run \
            --target x86_64-unknown-linux-gnu \
            --manifest-path luckyray-app/src-tauri/Cargo.toml
      - name: Test production admission and fail-closed paths
        id: admission_tests
        if: ${{ always() && !cancelled() && steps.test_compile.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":null,"resources":null}}'
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-diagnostic-target
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.95.0 cargo test --locked --lib \
            --target x86_64-unknown-linux-gnu \
            --manifest-path luckyray-app/src-tauri/Cargo.toml \
            -- --list > "$RUNNER_TEMP/luckyray-admission-tests.txt"
          tests=(
            'owned_process::linux_admission_tests::owned_spawn_rejects_before_child_can_write'
            'agent_browser::runtime::tests::production_agent_host_is_rejected_before_profile_or_gateway'
            'dsh_host::tests::production_linux_dsh_is_unavailable_before_creating_state'
            'dsh_runtime_seal::tests::linux_stable_file_lease_rejects_even_regular_files'
            'knowledge::tests::production_linux_knowledge_admission_preserves_files_and_creates_nothing'
            'knowledge::attachment_operations::linux_admission_tests::recovery_directory_is_rejected_before_creation'
            'linux_desktop_admission_tests::linux_credential_admission_blocks_real_desktop_startup_before_profile_io'
            'linux_desktop_admission_tests::linux_credential_admission_blocks_production_cli_and_mcp_entrypoints'
            'local_transport::tests::linux_credential_admission_blocks_transport_and_storage_before_io'
            'native_messaging::tests::linux_credential_admission_blocks_native_entrypoints_before_io'
            'tool_client::tests::linux_credential_admission_blocks_tool_client_before_profile_or_network'
          )
          for test in "${tests[@]}"; do
            grep -Fx "$test: test" "$RUNNER_TEMP/luckyray-admission-tests.txt"
            rustup run 1.95.0 cargo test --locked --lib \
              --target x86_64-unknown-linux-gnu \
              --manifest-path luckyray-app/src-tauri/Cargo.toml \
              "$test" -- --exact
          done
      - name: Summarize each diagnostic result
        if: ${{ always() }}
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          NATIVE_DEPS: ${{ steps.native_deps.outcome }}
          RUST: ${{ steps.rust.outcome }}
          MAIN_CHECK: ${{ steps.main_check.outcome }}
          TEST_COMPILE: ${{ steps.test_compile.outcome }}
          ADMISSION_TESTS: ${{ steps.admission_tests.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Linux desktop native diagnostics"
            echo "- Commit: $GITHUB_SHA"
            echo "- Checkout / commit verification: $CHECKOUT / $COMMIT"
            echo "- Native dependencies / Rust: $NATIVE_DEPS / $RUST"
            echo "- Main native library cargo check: $MAIN_CHECK"
            echo "- Library test binary compilation: $TEST_COMPILE"
            echo "- Production admission and fail-closed tests: $ADMISSION_TESTS"
            echo "- Previously passed GTK, Deno and package configuration checks were not repeated."
            echo "- Focus behavior and desktop UI launch: NOT_RUN"
            echo "- Package resources, sidecar identity and release gates: NOT_VERIFIED"
            echo "- No package or release artifact was produced."
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for result in "$CHECKOUT" "$COMMIT" "$NATIVE_DEPS" "$RUST" "$MAIN_CHECK"; do
            if [ "$result" != success ]; then failed=1; fi
          done
          if [ "$MAIN_CHECK" = success ] && [ "$TEST_COMPILE" != success ]; then failed=1; fi
          if [ "$TEST_COMPILE" = success ] && [ "$ADMISSION_TESTS" != success ]; then failed=1; fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more diagnostic steps failed or were not run; inspect the individual results."
            exit 1
          fi
