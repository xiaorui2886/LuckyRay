name: Linux desktop native candidate
on:
  push:
    branches: [port/linux-desktop-20261101]
permissions:
  contents: read
jobs:
  linux-native-candidate:
    if: github.repository == 'xiaorui2886/LuckyRay'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Check out the public candidate
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the candidate commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'Commit: %s\n' "$actual"
          test "$actual" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Install dependencies on the disposable runner
        id: native_deps
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb xauth dbus-x11
      - name: Install the pinned Rust toolchain
        id: rust
        continue-on-error: true
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check the real Linux application library
        id: main_check
        if: ${{ always() && !cancelled() && steps.native_deps.outcome == 'success' && steps.rust.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 35
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":null,"resources":null}}'
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-diagnostic-target
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Compilation diagnostic; package resources, sidecar identity and release gates are NOT verified."
          rustup run 1.95.0 cargo check --locked --lib \
            --target x86_64-unknown-linux-gnu --manifest-path luckyray-app/src-tauri/Cargo.toml
      - name: Exercise the changed Linux production modules
        id: core_tests
        if: ${{ always() && !cancelled() && steps.main_check.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":null,"resources":null}}'
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-diagnostic-target
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.95.0 cargo test --locked --lib \
            --target x86_64-unknown-linux-gnu --manifest-path luckyray-app/src-tauri/Cargo.toml \
            -- --list > "$RUNNER_TEMP/luckyray-core-tests.txt"
          tests=(
            'owned_process::linux::tests::linux_owned_process_stdio_exit_and_group_cleanup'
            'owned_process::linux::tests::linux_prelaunch_failure_and_unsafe_sources_do_not_start'
            'linux_file_store::tests::linux_commit_preserves_backup_and_rejects_stale_revision'
            'linux_file_store::tests::linux_interrupted_commit_recovers_without_overwriting_external_edit'
            'local_transport::linux_credentials::tests::linux_credentials_reject_links_permissions_and_stale_writers'
            'local_transport::tests::linux_credentials_round_trip_rotate_and_preserve_conflicting_state'
            'knowledge::tests::linux_production_notes_create_update_conflict_and_reopen'
            'knowledge::tests::linux_production_notes_detect_external_edits_and_recover_interruption'
            'dsh_runtime_seal::tests::linux_runtime_file_lease_detects_edits_and_rejects_links'
            'linux_desktop_admission_tests::linux_private_profile_initialization_uses_isolated_xdg'
            'native_messaging::tests::linux_generic_manifest_writer_preserves_existing_and_missing_paths'
            'tool_client::tests::linux_missing_credentials_do_not_create_profile_or_contact_network'
          )
          for test in "${tests[@]}"; do
            grep -Fx "$test: test" "$RUNNER_TEMP/luckyray-core-tests.txt"
            timeout --signal=TERM --kill-after=5s 60s \
              rustup run 1.95.0 cargo test --locked --lib \
              --target x86_64-unknown-linux-gnu --manifest-path luckyray-app/src-tauri/Cargo.toml \
              "$test" -- --exact
          done
      - name: Test the Linux directory opener with an isolated GIO handler
        id: directory_tests
        if: ${{ always() && !cancelled() && steps.native_deps.outcome == 'success' && steps.rust.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 35
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-diagnostic-target
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.95.0 cargo test --locked --lib \
            --target x86_64-unknown-linux-gnu --manifest-path luckyray-app/tests/linux-gtk-bridge/Cargo.toml \
            -- --list > "$RUNNER_TEMP/luckyray-directory-tests.txt"
          tests=(
            'linux_directory::tests::directory_validation_rejects_non_directories_and_relative_paths'
            'linux_directory::tests::local_directory_uri_round_trips_unicode_and_reserved_characters'
            'linux_directory_handler_test::production_gio_uses_isolated_registered_directory_handler'
          )
          for test in "${tests[@]}"; do
            grep -Fx "$test: test" "$RUNNER_TEMP/luckyray-directory-tests.txt"
            timeout --signal=TERM --kill-after=5s 60s \
              rustup run 1.95.0 cargo test --locked --lib \
              --target x86_64-unknown-linux-gnu --manifest-path luckyray-app/tests/linux-gtk-bridge/Cargo.toml \
              "$test" -- --exact
          done
      - name: Select the pinned frontend Node
        id: node
        if: ${{ always() && !cancelled() && steps.main_check.outcome == 'success' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - name: Build the actual application frontend
        id: frontend
        if: ${{ always() && !cancelled() && steps.node.outcome == 'success' }}
        continue-on-error: true
        working-directory: luckyray-app
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.3.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build a native application diagnostic executable
        id: native_build
        if: ${{ always() && !cancelled() && steps.frontend.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 35
        env:
          # This isolated debug executable is not a release or packaged runtime.
          TAURI_CONFIG: '{"identifier":"com.luckyray.desktop.dev","build":{"devUrl":null,"frontendDist":"../dist"},"bundle":{"active":false,"externalBin":null,"resources":null}}'
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-diagnostic-target
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.95.0 cargo build --locked --bin luckyray-app \
            --target x86_64-unknown-linux-gnu --manifest-path luckyray-app/src-tauri/Cargo.toml
      - name: Launch the real Tauri UI and exercise synthetic core flows
        id: native_smoke
        if: ${{ always() && !cancelled() && steps.native_build.outcome == 'success' && steps.core_tests.outcome == 'success' && steps.directory_tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.95.0 cargo install tauri-driver --locked --version 2.1.0 \
            --root "$RUNNER_TEMP/luckyray-webdriver"
          timeout --signal=TERM --kill-after=10s 180s \
            dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' \
            /usr/bin/python3 luckyray-app/tests/linux-desktop-smoke.py \
            --driver "$RUNNER_TEMP/luckyray-webdriver/bin/tauri-driver" \
            --application "$RUNNER_TEMP/luckyray-linux-diagnostic-target/x86_64-unknown-linux-gnu/debug/luckyray-app" \
            --output "$RUNNER_TEMP/luckyray-native-evidence"
      - name: Retain only synthetic screenshots and the scoped result
        if: ${{ always() && !cancelled() && steps.native_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-native-synthetic-evidence
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/luckyray-native-evidence/*.png
            ${{ runner.temp }}/luckyray-native-evidence/report.json
      - name: Summarize each actual result
        if: ${{ always() }}
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          NATIVE_DEPS: ${{ steps.native_deps.outcome }}
          RUST: ${{ steps.rust.outcome }}
          MAIN_CHECK: ${{ steps.main_check.outcome }}
          CORE_TESTS: ${{ steps.core_tests.outcome }}
          DIRECTORY_TESTS: ${{ steps.directory_tests.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          NATIVE_BUILD: ${{ steps.native_build.outcome }}
          NATIVE_SMOKE: ${{ steps.native_smoke.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Linux desktop candidate diagnostics"
            echo "- Commit: $GITHUB_SHA"
            echo "- Main library: $MAIN_CHECK"
            echo "- Changed process, file, credential and note tests: $CORE_TESTS"
            echo "- Directory/GIO tests: $DIRECTORY_TESTS"
            echo "- Frontend / native executable: $FRONTEND / $NATIVE_BUILD"
            echo "- Actual Tauri X11 startup, IPC, reopen and exit: $NATIVE_SMOKE"
            echo "- LSH/AI, signed runtime resources, release gates and installers: NOT_VERIFIED"
            echo "- The full test suite and hardware/Wayland matrix were not run."
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHECKOUT" "$COMMIT" "$NATIVE_DEPS" "$RUST" "$MAIN_CHECK" "$CORE_TESTS" "$DIRECTORY_TESTS" "$FRONTEND" "$NATIVE_BUILD" "$NATIVE_SMOKE"; do
            if [ "$result" != success ]; then
              echo "::error::A required candidate step failed or was not run. See its actual outcome."
              exit 1
            fi
          done
