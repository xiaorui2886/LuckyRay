name: Linux Main notes and PNG attachment validation
on:
  push:
    branches: [port/linux-desktop-20261101]
permissions:
  contents: read
jobs:
  linux-notes-attachments-validation:
    if: github.repository == 'xiaorui2886/LuckyRay'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Check out only the public candidate
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind the source and initialize private synthetic state
        id: init
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
        run: python3 luckyray-app/tests/linux-notes-ci.py init --work "$WORK_ROOT"
      - name: Select the pinned Node
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - name: Check only the path regressions and focused evidence gate offline
        id: offline
        run: |
          set -euo pipefail
          python3 luckyray-app/tests/linux-notes-ci.test.py -v
          node --test luckyray-app/tests/externalDropPaths.contract.test.cjs \
            luckyray-app/tests/notesDropRouting.contract.test.cjs \
            luckyray-app/tests/vaultImportSourceActivation.contract.test.cjs \
            luckyray-app/tests/linuxVaultPath.contract.test.cjs \
            luckyray-app/tests/linux-package-config.test.mjs
      - name: Build the required embedded frontend once
        id: frontend
        working-directory: luckyray-app
        run: |
          set -euo pipefail
          npm install --global pnpm@11.3.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
          pnpm build
      - name: Gate the native stage on real reading and Live component layout
        id: layout
        timeout-minutes: 7
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
        run: python3 luckyray-app/tests/linux-notes-ci.py layout --work "$WORK_ROOT"
      - name: Install normal dependencies on the disposable runner
        id: dependencies
        if: ${{ success() && steps.layout.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb xauth dbus-x11 desktop-file-utils \
            python3-gi gir1.2-gtk-3.0 fonts-noto-cjk xclip xdg-utils
          # T45: a pinned FFmpeg for the preview smoke only (never shipped).
          # Ubuntu's package is a GPL build; see T45-result.md for V4 licensing.
          sudo apt-cache policy ffmpeg
          sudo apt-get install -y --no-install-recommends ffmpeg=7:4.4.2-0ubuntu0.22.04.1
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          sha256sum "$(command -v ffmpeg)" "$(command -v ffprobe)"
      - name: Install the pinned Rust toolchain
        id: rust
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-import-checks
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup run 1.95.0 cargo test --locked --manifest-path luckyray-app/tests/linux-import-transaction/Cargo.toml
      - name: Build the actual Main once for the focused product flow
        id: build
        if: ${{ success() && steps.layout.outcome == 'success' }}
        timeout-minutes: 55
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-runtime-work/target
          # Actual runtime resources are staged below, never substituted by fixtures.
          # This build still does not establish a package or release sidecar identity.
          TAURI_CONFIG: '{"identifier":"com.luckyray.desktop.dev","build":{"devUrl":null,"frontendDist":"../dist"},"bundle":{"active":false,"externalBin":null,"resources":null}}'
        run: |
          set -euo pipefail
          rustup run 1.95.0 cargo build --locked --bin luckyray-app \
            --target x86_64-unknown-linux-gnu --manifest-path luckyray-app/src-tauri/Cargo.toml \
            --message-format=json-render-diagnostics > "$WORK_ROOT/private/native-artifacts.jsonl"
          python3 luckyray-app/tests/linux-notes-ci.py binaries --work "$WORK_ROOT"
      - name: Register the built native host and complete one real Native Messaging exchange
        id: native-messaging
        if: ${{ success() && steps.build.outcome == 'success' }}
        timeout-minutes: 25
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-runtime-work/target
          # Same identifier as the Main build; the host refuses to borrow a
          # production credential file.
          TAURI_CONFIG: '{"identifier":"com.luckyray.desktop.dev","build":{"devUrl":null,"frontendDist":"../dist"},"bundle":{"active":false,"externalBin":null,"resources":null}}'
        run: |
          set -euo pipefail
          # The host binary lives in this source tree, so it is built here
          # instead of downloaded. It needs the sidecar feature Main does not.
          rustup run 1.95.0 cargo build --locked --bin luckyray-native-host \
            --features sidecar-binaries --target x86_64-unknown-linux-gnu \
            --manifest-path luckyray-app/src-tauri/Cargo.toml
          host="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/luckyray-native-host"
          test -f "$host"
          python3 luckyray-app/tests/linux-native-registration-smoke.py \
            --application "$host" --output "$WORK_ROOT/private/native-messaging-report"
          python3 luckyray-app/tests/linux-notes-ci.py native-messaging --work "$WORK_ROOT"
      - name: Build the source-bound pinned WebDriver with closed diagnostics once
        id: driver
        timeout-minutes: 20
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
        run: |
          set -euo pipefail
          curl --disable --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --max-time 120 --max-filesize 14488 \
            --output "$WORK_ROOT/tauri-driver-2.1.0.crate" \
            https://static.crates.io/crates/tauri-driver/tauri-driver-2.1.0.crate
          python3 luckyray-app/tests/linux-tauri-driver-source.py \
            "$WORK_ROOT/tauri-driver-2.1.0.crate" "$WORK_ROOT/driver-source" \
            > "$WORK_ROOT/private/driver-source.json"
          rustup run 1.95.0 cargo install --path "$WORK_ROOT/driver-source" --locked --debug \
            --root "$WORK_ROOT/driver" --target-dir "$WORK_ROOT/driver-target"
      - name: Assemble the genuine pinned LSH runtime offline
        id: runtime
        timeout-minutes: 25
        working-directory: luckyray-app
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
        run: |
          set -euo pipefail
          curl --disable --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --max-time 180 --max-filesize 134217728 \
            --output "$WORK_ROOT/node.tar.gz" \
            https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-x64.tar.gz
          curl --disable --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --max-time 180 --max-filesize 33554432 \
            --output "$WORK_ROOT/pnpm.tgz" https://registry.npmjs.org/pnpm/-/pnpm-11.7.0.tgz
          node scripts/linux/acquire-lsh-inputs.mjs "$WORK_ROOT/inputs"
          node scripts/linux/prepare-lsh-runtime.mjs "$WORK_ROOT/node.tar.gz" "$WORK_ROOT/pnpm.tgz" \
            "$WORK_ROOT/inputs" "$WORK_ROOT/runtime" "$WORK_ROOT/records" \
            > "$WORK_ROOT/private/lsh-assembly.log"
      - name: Stage and identify complete resources at the actual Tauri directory
        id: resources
        timeout-minutes: 10
        working-directory: luckyray-app
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
        run: |
          set -euo pipefail
          node scripts/linux/stage-lsh-resources.mjs "$WORK_ROOT/runtime" "$WORK_ROOT/resources" \
            > "$WORK_ROOT/private/lsh-stage.log"
          python3 tests/linux-notes-ci.py resources --work "$WORK_ROOT"
      - name: Exercise one real Main notes and PNG flow with declared drop injection
        id: notes
        timeout-minutes: 15
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
        run: |
          python3 luckyray-app/tests/linux-notes-ci.py notes --work "$WORK_ROOT" \
            --driver "$WORK_ROOT/driver/bin/tauri-driver"
      - name: Install the pinned headless Secret Service on the disposable runner
        id: secret-service
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Independent of the dependencies step so a skipped native stage
          # cannot leave stale package lists. gnome-keyring is pinned to the
          # jammy-updates build; dbus-x11 follows the runner's security updates.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring=40.0-3ubuntu3 dbus-x11
          command -v dbus-run-session gnome-keyring-daemon
      - name: Exercise the Companion identity through a real and an absent Secret Service
        id: companion-keyring
        if: ${{ !cancelled() && steps.secret-service.outcome == 'success' }}
        timeout-minutes: 15
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-keyring-checks
          KEYRING_SCRATCH: ${{ runner.temp }}/luckyray-linux-keyring-scratch
        run: |
          set -euo pipefail
          manifest=luckyray-app/tests/linux-companion-keyring/Cargo.toml
          session=luckyray-app/tests/linux-secret-service-session.sh
          # Production keyring modules with fakes; the live tests stay ignored here.
          rustup run 1.95.0 cargo test --locked --manifest-path "$manifest"
          mkdir -m 700 "$KEYRING_SCRATCH"
          # absent: no reachable Secret Service, every operation must refuse.
          # present: throwaway gnome-keyring on a private bus, random unlock
          # password never printed; store, load, replace and delete must work.
          # Only test names and counts are logged, and each run must execute
          # exactly its expected tests so an empty filter cannot pass.
          for mode_count in absent:1 present:3; do
            mode="${mode_count%%:*}"; count="${mode_count##*:}"
            timeout 300 bash "$session" "$mode" "$KEYRING_SCRATCH/$mode" -- \
              rustup run 1.95.0 cargo test --locked --manifest-path "$manifest" \
              -- --ignored --test-threads=1 "live_${mode}_" | tee "$KEYRING_SCRATCH/$mode.log"
            grep -qx "test result: ok. $count passed; 0 failed; 0 ignored; 0 measured; [0-9]* filtered out; finished in [0-9.]*s" \
              "$KEYRING_SCRATCH/$mode.log"
          done
      - name: Pair a synthetic phone through the real keyring-backed Companion gateway
        id: companion-pairing
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.companion-keyring.outcome == 'success' }}
        timeout-minutes: 55
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-runtime-work/target
          KEYRING_SCRATCH: ${{ runner.temp }}/luckyray-linux-keyring-scratch
          # Same identifier as the Main build; the gateway test never borrows a
          # production credential file.
          TAURI_CONFIG: '{"identifier":"com.luckyray.desktop.dev","build":{"devUrl":null,"frontendDist":"../dist"},"bundle":{"active":false,"externalBin":null,"resources":null}}'
          # The standard WebSocket fixture needs the same pinned websockets 15.x
          # as the existing LSH full-chain fixture. Installed into the job's
          # private work root only; no system package is touched here.
          PYTHONPATH: ${{ runner.temp }}/luckyray-linux-runtime-work/private/t44-ws-deps
          LUCKYRAY_COMPANION_WS_PYTHON: python3
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --target "$WORK_ROOT/private/t44-ws-deps" "websockets==15.0.1"
          test -f "$PYTHONPATH/websockets/sync/client.py"
          # Reuse the native build target: the same --target triple as the Main
          # build, so its dependency artifacts are reused and only the lib test
          # binary is added (without it Cargo would rebuild every dependency
          # under a second target/debug tree).
          # Run inside a fresh private Secret Service session so the real
          # LinuxIdentityStore reads and writes a throwaway keyring only.
          test_name=companion_gateway::tests::live_present_companion_pairing_smoke
          # The session script creates its own fresh 0700 scratch directory.
          timeout 900 bash luckyray-app/tests/linux-secret-service-session.sh \
            present "$KEYRING_SCRATCH/pairing" -- \
            rustup run 1.95.0 cargo test --locked --lib \
            --target x86_64-unknown-linux-gnu --manifest-path luckyray-app/src-tauri/Cargo.toml \
            -- --ignored --exact "$test_name" --test-threads=1 \
            | tee "$WORK_ROOT/private/t44-pairing.log"
          # An empty filter must never count as a pass: require exactly one test.
          grep -qx "test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]* filtered out; finished in [0-9.]*s" \
            "$WORK_ROOT/private/t44-pairing.log"
      - name: Exercise Linux FFmpeg/ffprobe preview against synthetic video
        id: media-preview
        # Independent of the Companion steps: a pairing failure must not hide
        # the media result (each outcome is reported separately by finish).
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 55
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
          CARGO_TARGET_DIR: ${{ runner.temp }}/luckyray-linux-runtime-work/target
          MEDIA_DIR: ${{ runner.temp }}/luckyray-linux-runtime-work/private/media-preview
          # Absolute: the test binary runs with the package root as its cwd.
          MEDIA_RESOURCES: ${{ runner.temp }}/luckyray-linux-runtime-work/private/media-resources
          # Same identifier as the Main build, so only the lib test binary is
          # added to the existing target tree.
          TAURI_CONFIG: '{"identifier":"com.luckyray.desktop.dev","build":{"devUrl":null,"frontendDist":"../dist"},"bundle":{"active":false,"externalBin":null,"resources":null}}'
        run: |
          set -euo pipefail
          mkdir -p "$MEDIA_DIR"
          ffmpeg_bin="$(command -v ffmpeg)"; ffprobe_bin="$(command -v ffprobe)"
          test "$ffmpeg_bin" = /usr/bin/ffmpeg && test "$ffprobe_bin" = /usr/bin/ffprobe
          # Synthetic videos only: rotated metadata, audio-only refusal, and a
          # long realtime stream for the timeout/process-group check.
          ffmpeg -hide_banner -loglevel error -y -f lavfi \
            -i testsrc=duration=6:size=320x180:rate=25 -c:v libx264 -pix_fmt yuv420p \
            -metadata:s:v:0 rotate=90 -t 6 "$MEDIA_DIR/rotated.mp4"
          ffmpeg -hide_banner -loglevel error -y -f lavfi \
            -i sine=frequency=440:duration=2 -c:a aac "$MEDIA_DIR/audio.m4a"
          ffmpeg -hide_banner -loglevel error -y -f lavfi \
            -i testsrc=duration=30:size=320x180:rate=25 -c:v libx264 -pix_fmt yuv420p \
            -t 30 "$MEDIA_DIR/long.mp4"
          sha256sum "$MEDIA_DIR/rotated.mp4" "$MEDIA_DIR/audio.m4a" "$MEDIA_DIR/long.mp4"
          # The generator mirrors the existing prepared-runtime fixture shape
          # outside the checkout (never in src-tauri/); the production
          # app_owned verifier remains the only authority.
          manifest_sha="$(python3 luckyray-app/tests/linux-media-preview-runtime.py \
            "$MEDIA_RESOURCES/media-engine" "$ffmpeg_bin" "$ffprobe_bin")"
          [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          test_name=material_native_video::preview::tests::live_present_ffmpeg_preview
          LUCKYRAY_MEDIA_ENGINE_MANIFEST_SHA256="$manifest_sha" \
          LUCKYRAY_LIVE_FFMPEG=present \
          LUCKYRAY_LIVE_MEDIA_RESOURCES="$MEDIA_RESOURCES" \
          LUCKYRAY_LIVE_MEDIA_VIDEO="$MEDIA_DIR/rotated.mp4" \
          LUCKYRAY_LIVE_MEDIA_AUDIO="$MEDIA_DIR/audio.m4a" \
          LUCKYRAY_LIVE_MEDIA_LONG="$MEDIA_DIR/long.mp4" \
          timeout 900 rustup run 1.95.0 cargo test --locked --lib \
            --target x86_64-unknown-linux-gnu \
            --manifest-path luckyray-app/src-tauri/Cargo.toml \
            -- --ignored --exact "$test_name" --test-threads=1 \
            | tee "$WORK_ROOT/private/t45-media-preview.log"
          # An empty filter must never count as a pass: require exactly one test.
          grep -qx "test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]* filtered out; finished in [0-9.]*s" \
            "$WORK_ROOT/private/t45-media-preview.log"
      - name: Preserve every actual outcome and fail incomplete coverage
        if: ${{ always() && steps.init.outcome == 'success' }}
        env:
          WORK_ROOT: ${{ runner.temp }}/luckyray-linux-runtime-work
          CI_CHECKOUT: ${{ steps.checkout.outcome }}
          CI_INIT: ${{ steps.init.outcome }}
          CI_OFFLINE: ${{ steps.offline.outcome }}
          CI_DEPENDENCIES: ${{ steps.dependencies.outcome }}
          CI_RUST: ${{ steps.rust.outcome }}
          CI_NODE: ${{ steps.node.outcome }}
          CI_FRONTEND: ${{ steps.frontend.outcome }}
          CI_LAYOUT: ${{ steps.layout.outcome }}
          CI_BUILD: ${{ steps.build.outcome }}
          CI_NATIVE_MESSAGING: ${{ steps.native-messaging.outcome }}
          CI_DRIVER: ${{ steps.driver.outcome }}
          CI_RUNTIME: ${{ steps.runtime.outcome }}
          CI_RESOURCES: ${{ steps.resources.outcome }}
          CI_NOTES: ${{ steps.notes.outcome }}
          CI_SECRET_SERVICE: ${{ steps.secret-service.outcome }}
          CI_COMPANION_KEYRING: ${{ steps.companion-keyring.outcome }}
          CI_COMPANION_PAIRING: ${{ steps.companion-pairing.outcome }}
          CI_MEDIA_PREVIEW: ${{ steps.media-preview.outcome }}
        run: python3 luckyray-app/tests/linux-notes-ci.py finish --work "$WORK_ROOT"
      - name: Retain only the explicit synthetic JSON evidence
        if: ${{ always() && steps.init.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-notes-attachments-synthetic-evidence
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/luckyray-linux-runtime-work/evidence/source.json
            ${{ runner.temp }}/luckyray-linux-runtime-work/evidence/build.json
            ${{ runner.temp }}/luckyray-linux-runtime-work/evidence/resources.json
            ${{ runner.temp }}/luckyray-linux-runtime-work/evidence/notes.json
            ${{ runner.temp }}/luckyray-linux-runtime-work/evidence/nativeMessaging.json
            ${{ runner.temp }}/luckyray-linux-runtime-work/evidence/result.json
