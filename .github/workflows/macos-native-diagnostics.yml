name: macOS internal native validation

# One internal native build per reviewed push. Incomplete corresponding source
# still prevents distribution. Only the projected report and own-window PNG
# are uploaded; the temporary app and all dependencies stay on the runner.
on:
  push:
    branches: [port/macos-desktop-20261101]

permissions:
  contents: read

concurrency:
  group: macos-product-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-internal-validation:
    if: github.repository == 'xiaorui2886/LuckyRay'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: luckyray-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record and require the native Apple Silicon runner
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Create a disposable worktree of the exact reviewed source
        working-directory: ${{ github.workspace }}
        run: git worktree add --detach "$RUNNER_TEMP/luckyray-macos-internal" "$GITHUB_SHA"
      - name: Set the pinned Rust toolchain and target
        working-directory: ${{ runner.temp }}/luckyray-macos-internal/luckyray-app
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
          rustup override set 1.95.0
          rustc -vV
      - name: Validate the real app, runtimes, sidecars and own window internally
        working-directory: ${{ runner.temp }}/luckyray-macos-internal/luckyray-app
        # The projected report is the diagnostic artifact. Bootstrap and child
        # output are discarded; any nonzero exit still fails this step/job.
        run: npm exec --yes --package=pnpm@11.25.0 -- node scripts/check-macos-internal.mjs > /dev/null 2>&1
      - name: Retain only the projected report and actual own-window screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-internal-validation
          path: |
            ${{ runner.temp }}/luckyray-macos-internal/luckyray-app/src-tauri/.macos-build/internal-validation-evidence/report.json
            ${{ runner.temp }}/luckyray-macos-internal/luckyray-app/src-tauri/.macos-build/internal-validation-evidence/LuckyRay-real-app.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
