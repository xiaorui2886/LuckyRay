name: macOS native product build

# One native product build per reviewed push. The lower-level native checks
# already passed on 6d227334; this phase exercises full app/resources/sidecars
# and startup, without repeating those diagnostics or requesting real accounts.
on:
  push:
    branches: [port/macos-desktop-20261101]

permissions:
  contents: read

concurrency:
  group: macos-product-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-product-build:
    if: github.repository == 'xiaorui2886/LuckyRay'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: luckyray-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record and require the native Apple Silicon runner
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Set the pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
          rustup override set 1.95.0
          rustc -vV
      - name: Install the frozen frontend dependencies without lifecycle scripts
        run: npm exec --yes --package=pnpm@11.25.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the complete native app with real runtimes and sidecars
        id: full_app
        run: npm exec --yes --package=pnpm@11.25.0 -- node scripts/build-macos.mjs
      - name: Start the actual LuckyRay app and capture its own window
        if: steps.full_app.outcome == 'success'
        run: node scripts/check-macos-app-startup.mjs
      - name: Retain the native app, disk image and actual window evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-native-product
          path: |
            luckyray-app/src-tauri/target/aarch64-apple-darwin/release/bundle/*.app.tar.gz
            luckyray-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            luckyray-app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos-artifacts-*.json
            luckyray-app/src-tauri/.macos-build/actual-app-startup-*/LuckyRay-real-app.png
            luckyray-app/src-tauri/.macos-build/actual-app-startup-*/startup-result.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 2
