<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/luckyray-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const allowedThemes = ["dark", "light", "ivory-editorial", "rose-tea", "github-dark", "white-zero", "bangladesh-green", "lilac-milk", "blue-whisper"];
        let theme = "dark";
        try {
          const saved = JSON.parse(localStorage.getItem("luckyray-settings-v1") || "{}");
          const candidate = saved["general.theme"] || saved.general?.theme;
          if (allowedThemes.includes(candidate)) theme = candidate;
        } catch {
          theme = "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeReady = "false";
      })();
    </script>
    <link rel="stylesheet" href="/src/core/theme/themeTokens.css" />
    <title>luckyray</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
