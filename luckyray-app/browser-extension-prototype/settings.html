<!doctype html>
<html lang="zh-CN" data-lr-theme="dark"><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><title>LuckyRay 快捷键设置</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="settings.css"></head>
<body><main><img src="icons/icon-48.png" width="36" height="36" alt=""><h1>采集设置</h1><label class="preference"><input id="video-overlays" type="checkbox" disabled><span>显示视频悬浮按钮</span></label><p class="hint">关闭只隐藏网页视频右上角的图标。面板发现、采集和其他入口仍然可用，对当前及后续页面都生效。</p><h2>快捷键</h2><p>按键由浏览器管理，可随时调整。视频悬浮按钮切换默认未分配快捷键。</p><dl id="commands" aria-live="polite"></dl><button id="configure" type="button">在浏览器中设置快捷键</button><p class="hint">显示“未设置”时，可自行分配按键。若按键与系统或其他扩展冲突，请换一组。切换图标不会保存媒体；采集后仍由你确认保存。</p></main><script src="appearance.js"></script><script src="video-overlay-preference.js"></script><script src="settings.js"></script></body></html>
