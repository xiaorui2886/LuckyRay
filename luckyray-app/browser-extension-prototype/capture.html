<!doctype html>
<html lang="zh-CN" data-lr-theme="dark">
<head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuckyRay 采集预览</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="capture.css"></head>
<body data-stage="setup">
  <header><button id="restart" class="icon-button" type="button" aria-label="返回，重新采集" title="返回" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button><div class="heading-copy"><span class="eyebrow">LUCKYRAY / COLLECT</span><h1 id="heading">网页截图</h1></div><button id="cancel" class="icon-button" type="button" aria-label="关闭采集预览" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
  <main>
    <p id="source" hidden></p>
    <section id="receipt" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><p id="receipt-text"></p><p id="view-hint" class="muted"></p></section>
    <section id="setup">
      <div class="setup-fields"><div id="mode-field"><select id="mode" aria-label="截图范围" hidden><option value="article">正文剪藏</option><option value="visible">当前可见区域</option><option value="region">框选区域</option><option value="element">网页元素</option><option value="full">完整网页</option></select>
        <div class="mode-options" role="group" aria-label="截图范围">
          <button type="button" data-capture-mode="visible"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg><span>可见区域</span></button>
          <button type="button" data-capture-mode="region"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M8 8h8v8H8z"/></svg><span>框选区域</span></button>
          <button type="button" data-capture-mode="element"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/></svg><span>网页元素</span></button>
          <button type="button" data-capture-mode="full"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h6"/></svg><span>完整网页</span></button>
        </div></div>
      <label id="library-field">保存到<select id="library"><option value="">正在读取素材库…</option></select></label></div>
      <p id="mode-hint" class="muted"></p>
      <button class="primary" id="start" type="button">开始截图</button>
    </section>
    <section id="preview" hidden>
      <label for="title" class="muted">保存标题（点击修改）</label>
      <input id="title" maxlength="200" aria-label="保存标题" placeholder="输入保存标题">
      <div class="preview-media"><img id="image-preview" alt="待保存截图" hidden><div id="article-preview" tabindex="0" aria-label="完整正文预览"></div></div>
      <p id="dimensions" class="muted"></p>
      <details id="organize"><summary>整理 <span class="muted">文件夹与标签</span></summary>
        <div id="taxonomy" class="row"><label>文件夹<select id="folder"><option value="">根目录</option></select></label><fieldset><legend>标签</legend><div id="tags"></div></fieldset></div>
        <div id="new-taxonomy" class="row"><label>新文件夹<input id="new-folder" maxlength="120" placeholder="可选"></label><label>添加标签<input id="new-tags" maxlength="300" placeholder="用逗号分隔"></label></div>
        <p id="organize-hint" class="muted" hidden>仅保存到根目录，不附加标签。</p>
        <button id="retry-taxonomy" type="button" hidden>重试读取分类</button>
      </details>
      <p id="image-hint" class="muted" hidden>附图保留为网页链接，非离线附件。</p>
      <label id="link-fallback" hidden><input id="as-link" type="checkbox">改存来源链接</label>
      <footer><span id="destination" title="本次保存目标"></span><button class="primary" id="save" type="button">保存</button></footer>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="retry-state" type="button" hidden>重试</button>
    <section id="pending" hidden><p id="pending-text"></p><button id="acknowledge" type="button" hidden>已在桌面核对，继续剪藏</button></section>
  </main>
  <script src="extension-protocol.js"></script><script src="appearance.js"></script><script src="capture-panel.js"></script>
</body></html>
