[package]
name = "luckyray-linux-import-checks"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
doctest = false

[dependencies]
libc = "=0.2.186"
hmac = "=0.12.1"
# linux_file_store.rs is compiled here too and names its journal nonce with
# rand::random, so the crate needs the same pinned version as src-tauri.
rand = "=0.8.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
