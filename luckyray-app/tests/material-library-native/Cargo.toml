[package]
name = "material-library-native-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
