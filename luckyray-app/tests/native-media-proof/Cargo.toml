[package]
name = "luckyray-native-media-composition-proof"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone, nonshipping engineering program. No Tauri application/profile.
[workspace]

[dependencies]
webview2-com = "=0.38.2"
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com",
  "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_Storage_Xps", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"
] }
